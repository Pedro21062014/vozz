name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testar:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Lint (pega ReferenceError antes de publicar)
        run: npx eslint src/

      - name: Rodar testes
        run: npm test

      - name: Medir fidelidade do G2P
        run: npm run eval

      - name: Conferir conteúdo do pacote
        run: npm pack --dry-run
