name: Publicar no npm

# Sempre publica de verdade. Dois gatilhos:
#   - push de uma tag "v*" (ex.: v0.1.0)
#   - execução manual pela aba Actions ("Run workflow")
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  testar:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Rodar testes
        run: npm test

  publicar:
    name: Publicar
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # habilita procedência (provenance) no npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Conferir se o secret NPM_TOKEN foi configurado
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::O secret NPM_TOKEN não está configurado neste repositório."
            echo "Crie um token do tipo 'Automation' em npmjs.com (Access Tokens)"
            echo "e salve em: Settings > Secrets and variables > Actions,"
            echo "com o nome exato NPM_TOKEN. Depois rode o workflow de novo."
            exit 1
          fi
          echo "NPM_TOKEN presente."

      - name: Conferir se a tag bate com a versão do package.json
        if: github.event_name == 'push'
        run: |
          VERSAO_PKG="$(node -p "require('./package.json').version")"
          VERSAO_TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $VERSAO_PKG | tag: $VERSAO_TAG"
          if [ "$VERSAO_PKG" != "$VERSAO_TAG" ]; then
            echo "::error::A tag ($VERSAO_TAG) não corresponde à versão do package.json ($VERSAO_PKG)."
            echo "Use 'npm version <patch|minor|major>' para criar tag e versão juntas."
            exit 1
          fi

      - name: Conferir se a versão já existe no npm
        run: |
          NOME="$(node -p "require('./package.json').name")"
          VERSAO="$(node -p "require('./package.json').version")"
          if npm view "$NOME@$VERSAO" version >/dev/null 2>&1; then
            echo "::error::$NOME@$VERSAO já foi publicado. Suba a versão com 'npm version patch' antes."
            exit 1
          fi
          echo "$NOME@$VERSAO está livre."

      - name: Publicar no npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resumo
        if: always()
        run: |
          NOME="$(node -p "require('./package.json').name")"
          VERSAO="$(node -p "require('./package.json').version")"
          {
            echo "### Publicação"
            echo ""
            echo "- Pacote: \`$NOME@$VERSAO\`"
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- npm: https://www.npmjs.com/package/$NOME"
          } >> "$GITHUB_STEP_SUMMARY"
